[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semgraf-api"
version = "0.1.0"
description = "Semgraf dual-plane API — metric compile + relationship traverse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "duckdb>=1.1.0",
]

[project.scripts]
semgraf-api = "semgraf_api.main:run"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["semgraf_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
